<!doctype html>
<meta charset="utf-8">
<!--
  Исходник превью демо FAQ-страницы (1200x630).
  Готовый файл лежит в products/demo/faq-og.jpg и попадает в витрину как og.jpg.

  Пересобрать после правки текста:
    npx playwright screenshot --viewport-size=1200,630 \
      tools/og-faq.html products/demo/faq-og.jpg
-->
<style>
  /* Превью FAQ-страницы для соцсетей. Палитра темы «Воздух» из демо салона. */
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #faf7f5;
    color: #2a211e;
    font-family: "DejaVu Sans", "Liberation Sans", sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 58px 76px;
    position: relative; overflow: hidden;
  }
  .blob { position: absolute; border-radius: 50%; }
  .b1 { width: 620px; height: 620px; right: -210px; top: -230px; background: #f0dee5; }
  .b2 { width: 420px; height: 420px; left: -160px; bottom: -220px; background: #efe4de; }
  .inner { position: relative; }
  .kicker { font-size: 24px; color: #7a2e4e; letter-spacing: .02em; }
  h1 { margin-top: 18px; font-size: 62px; line-height: 1.08; letter-spacing: -.02em; max-width: 16ch; font-family: Georgia, serif; font-weight: 400; }
  .lead { margin-top: 22px; font-size: 27px; line-height: 1.4; color: #6e625c; max-width: 26ch; }
  .row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 28px; }
  .items { display: flex; gap: 12px; }
  .chip { padding: 12px 22px; border-radius: 999px; background: #ffffff; color: #2a211e; font-size: 22px; }
  .brand { font-size: 23px; white-space: nowrap; color: #6e625c; text-align: right; line-height: 1.45; }
</style>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="inner">
  <div class="kicker">Страница вопросов и ответов</div>
  <h1>Отвечаем один раз — работает каждый день</h1>
  <p class="lead">Аккордеон, микроразметка для Яндекса, ссылка на живого человека.</p>
</div>
<div class="row">
  <div class="items">
    <span class="chip">Сколько стоит</span>
    <span class="chip">Как записаться</span>
    <span class="chip">Есть ли гарантия</span>
  </div>
  <div class="brand">AI-Profigrup<br>демонстрационная сборка</div>
</div>

<!doctype html>
<meta charset="utf-8">
<!--
  Исходник превью страницы /tg для соцсетей (1200x630).
  Готовый файл лежит в public/og/tg.jpg.

  Пересобрать после правки текста:
    npx playwright screenshot --viewport-size=1200,630 \
      tools/og-tg.html public/og/tg.jpg

  Палитра взята из src/styles.css: тёмный фон и фирменный градиент
  от голубого к сиреневому.
-->
<style>
  /* Превью страницы /tg для соцсетей. Палитра сайта: тёмный фон и фирменный
     градиент от голубого к сиреневому (см. src/styles.css). */
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: oklch(0.16 0.02 270);
    color: oklch(0.98 0.005 270);
    font-family: "DejaVu Sans", "Liberation Sans", sans-serif;
    position: relative;
    overflow: hidden;
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(oklch(1 0 0 / 0.05) 1px, transparent 1px),
      linear-gradient(90deg, oklch(1 0 0 / 0.05) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at 25% 40%, black 35%, transparent 78%);
  }
  .glow {
    position: absolute;
    width: 760px;
    height: 760px;
    right: -260px;
    top: -220px;
    background: radial-gradient(circle, oklch(0.72 0.18 305 / 0.42), transparent 62%);
  }
  .glow2 {
    position: absolute;
    width: 620px;
    height: 620px;
    left: -200px;
    bottom: -280px;
    background: radial-gradient(circle, oklch(0.72 0.16 245 / 0.3), transparent 64%);
  }
  .frame {
    position: relative;
    height: 100%;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-size: 25px;
    color: oklch(0.78 0.02 270);
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, oklch(0.72 0.16 245), oklch(0.72 0.18 305));
  }
  h1 {
    font-size: 92px;
    line-height: 1.04;
    letter-spacing: -0.025em;
    font-weight: 700;
    max-width: 20ch;
  }
  h1 .accent {
    background: linear-gradient(135deg, oklch(0.72 0.16 245), oklch(0.72 0.18 305));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .lead {
    margin-top: 26px;
    font-size: 31px;
    line-height: 1.42;
    color: oklch(0.8 0.02 270);
    max-width: 30ch;
  }
  .bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 32px;
  }
  .handle {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 20px 34px;
    border-radius: 999px;
    background: linear-gradient(135deg, oklch(0.72 0.16 245), oklch(0.72 0.18 305));
    color: oklch(0.16 0.02 270);
    font-size: 32px;
    font-weight: 700;
  }
  .site { font-size: 26px; color: oklch(0.72 0.02 270); text-align: right; line-height: 1.5; }
  svg { display: block; }
</style>
<div class="glow"></div>
<div class="glow2"></div>
<div class="grid"></div>
<div class="frame">
  <div>
    <div class="kicker"><span class="dot"></span>Telegram-канал</div>
    <h1>Нейросети в бизнесе <span class="accent">без шума</span></h1>
    <p class="lead">Кейсы внедрения с цифрами, готовые промпты и инструменты. Пара постов в неделю.</p>
  </div>
  <div class="bottom">
    <div class="handle">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4.5 2.8 11.4c-.6.2-.6 1 .1 1.2l4.7 1.4 1.8 5.1c.2.6 1 .7 1.3.2l2.4-3.2 4.7 3.5c.5.4 1.2.1 1.3-.5L22 5.4c.1-.6-.4-1.1-1-.9Z"/><path d="m7.6 14 10.9-7.3-8.6 8.5"/></svg>
      @ai_prodazhi_pro
    </div>
    <div class="site">AI-Profigrup<br>aiprofigrup.ru</div>
  </div>
</div>

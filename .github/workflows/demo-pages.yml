# Публикация демо «Нейро-Портфолио» на GitHub Pages.
#
# Сайт собирается из products/demo и укладывается в ветку
# gh-pages — её и отдаёт Pages по адресу
# https://sabutorin97-boop.github.io/remix-of-ai-business-solutions/
#
# Ветка gh-pages содержит только собранную статику, исходников в ней нет:
# правится всё в products/, а сюда результат приезжает сам.

name: Демо Нейро-Портфолио

on:
  push:
    branches: [main]
    paths:
      - "products/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Собрать и выложить витрину
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Поставить Jinja2
        run: pip install --quiet jinja2

      - name: Прогнать критерии приёмки портфолио
        run: python selftest.py
        working-directory: products/neuro-portfolio

      - name: Прогнать критерии приёмки AI-FAQ
        run: python selftest.py
        working-directory: products/ai-faq

      - name: Собрать витрину
        run: python products/demo/build_site.py site/

      - name: Выложить в ветку gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch gh-pages "$remote" published

          # Содержимое ветки заменяется целиком, .git при этом не трогаем.
          find published -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r site/. published/

          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Витрина не изменилась, публиковать нечего."
            exit 0
          fi
          git commit -q -m "Витрина демо: сборка из ${GITHUB_SHA:0:7}"
          git push -q origin gh-pages
          echo "Витрина обновлена."
